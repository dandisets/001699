description: 'Fragile X Syndrome (FXS) is a common cause of autism spectrum disorder
  and intellectual disability (ASD/ID), but the altered neural mechanisms underlying
  it remain unclear. Here, we investigate the development of the head-direction (HD)
  system in a rat model of FXS  (Fmr1-/y rats) through electrophysiological recordings
  in the postsubiculum during exploration and sleep. Surprisingly, juvenile Fmr1-/y
  rats exhibited sharper HD tuning and increased stability of the HD signal in relation
  to the external environment.  Increase in intrinsic HD tuning persisted across behavioral
  and sleep states. In contrast, in adult Fmr1-/y rats, HD tuning was less stable
  than in WT rats despite normal intrinsic HD tuning. These findings suggest an apparent
  transient sharpening of HD coding in juvenile Fmr1-/y rats, followed by a degradation
  in adulthood, mirroring the developmental regression often observed in ASD/ID. Overall,
  our work reveals network-level dysfunctions in FXS and their developmental trajectories. '
